<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sf-grad-a" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>
    <linearGradient id="sf-grad-b" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182032" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Hexagon Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#sf-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <g filter="url(#sf-glow)" transform="translate(2, 0)">
    <!-- Geometric Top Flow Loop (Upper Arc of S) -->
    <path d="M 30 14 C 38 14 43 18.5 43 24.5 C 43 29.5 39 32.5 33 34 L 27 35.5 C 23 36.5 21 38.5 21 41.5 C 21 45 24.5 47.5 30 47.5 C 34.5 47.5 38 45.5 40 43.5"
          stroke="url(#sf-grad-b)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Geometric Bottom Counter Ribbon (Interlaced Flow Loop) -->
    <path d="M 30 14 C 24.5 14 20 17 18 20.5"
          stroke="url(#sf-grad-a)" stroke-width="5" stroke-linecap="round" />
    <path d="M 27 35.5 C 33 34 37 31.5 37 27 C 37 22.5 33 19.5 28 19.5 C 22.5 19.5 18 23 18 28.5 C 18 34.5 23 37.5 29 39 L 33 40 C 38 41.2 41 43.5 41 47"
          stroke="url(#sf-grad-a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Core Focal Accent Dots -->
    <circle cx="30" cy="14" r="3" fill="#00F2FE" />
    <circle cx="30" cy="47.5" r="3" fill="#10B981" />
  </g>
</svg>
